version: "3.8"

# Container logs are unbounded by default. A crash-looping service can fill the
# host disk, and a full disk on this box does not merely stop logging: nginx can
# no longer write its proxy temp files, so every response larger than its
# in-memory buffers (~132 KiB) is truncated mid-body and the app stops loading
# entirely. Cap every service's log so that cannot happen again.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  tweb.dependencies:
    container_name: tweb.dependencies
    build:
      context: .
      dockerfile: .docker/Dockerfile_dependencies
    volumes:
      - "./node_modules:/app/node_modules"
    command: pnpm install
    logging: *default-logging

  tweb.develop:
    container_name: tweb.develop
    build:
      context: .
      dockerfile: .docker/Dockerfile_develop
    volumes:
      - "./:/app"
    ports:
      - 8080:8080
    command: pnpm start-in-docker
    logging: *default-logging

  tweb.production:
    container_name: tweb.production
    build:
      context: .
      dockerfile: .docker/Dockerfile_production
      args:
        # Bump per deploy so open tabs detect the new version. Defaults to unix
        # seconds inside the image when unset; set it explicitly (e.g.
        # BUILD_NUMBER=$(date +%s)) to make a rebuild reproducible.
        BUILD_NUMBER: "${BUILD_NUMBER:-}"
        # Self-hosted GlitchTip DSN, inlined into the bundle at build time.
        # Export it (or put it in a .env next to this file) before building, or
        # the deploy ships with error tracking off.
        VITE_GLITCHTIP_DSN: "${VITE_GLITCHTIP_DSN:-}"
        # Source-map upload to GlitchTip. Optional: unset = build as before,
        # with minified stacks. The token is a secret — export it, don't commit
        # it. url/org/project fall back to the defaults in vite.config.ts.
        SENTRY_AUTH_TOKEN: "${SENTRY_AUTH_TOKEN:-}"
        SENTRY_URL: "${SENTRY_URL:-}"
        SENTRY_ORG: "${SENTRY_ORG:-}"
        SENTRY_PROJECT: "${SENTRY_PROJECT:-}"
        # Node heap ceiling for `pnpm build` (MB). The default 4096 fits the
        # ~5.9G production box; lower it when building on something smaller.
        NODE_BUILD_HEAP_MB: "${NODE_BUILD_HEAP_MB:-4096}"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - shared

networks:
  shared:
    external: true
