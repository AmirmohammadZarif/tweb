# MTProto relay — the server half of Settings → General → Connection.
#
# Forwards the client's (already obfuscated, opaque) MTProto stream to the
# matching Telegram web endpoint. URL layout is fixed by src/lib/mtproto/relay.ts:
#
#   /mtproto/ws/{dc}{-1?}/{apiws|apiws_test|apiws_premium}
#       → wss://kws{dc}{-1?}.web.telegram.org/{path}
#   /mtproto/http/{sub}{-1?}/{apiw1|apiw_test1}
#       → https://{sub}{-1?}.web.telegram.org/{path}   (sub = pluto|venus|…)
#
# "-1" is Telegram's media (download/upload) DC alias — it must be forwarded
# to the -1 host, not collapsed onto the main one.
#
# Deployed as the `tweb.relay` compose service. In front of it, NPM needs a
# custom location `/mtproto/` on the web.andropay.xyz proxy host pointing at
# http://tweb.relay:80 with "Websockets Support" ON. It must bypass tweb-auth:
# that Python proxy buffers whole responses and cannot carry a WebSocket
# upgrade (see the deploy notes in memory / .docker/nginx.conf).
#
# NOTE: nothing here is authenticated — the app's own auth cookie gate is on
# HTML navigations only. The relay only ever forwards to *.web.telegram.org,
# so the worst case is someone else using it as a Telegram relay too.

# proxy_pass with a variable target needs a resolver for the runtime DNS lookup
# (a literal host is resolved once at startup and would go stale on a Telegram
# IP change). Docker's embedded DNS forwards public names to the host resolver.
resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;

# WebSocket connections are long-lived; a 60s idle default would cut them.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  access_log off;

  location ~ ^/mtproto/ws/(?<dc>[1-5])(?<media>-1)?/(?<path>apiws(?:_test)?(?:_premium)?)$ {
    set $upstream kws$dc$media.web.telegram.org;

    proxy_pass https://$upstream/$path;
    proxy_http_version 1.1;
    proxy_set_header Host $upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Telegram accepts any Origin (the app connects from localhost in dev), but
    # present a plain one anyway instead of leaking the deployment's host.
    proxy_set_header Origin https://web.telegram.org;

    proxy_ssl_server_name on;
    proxy_ssl_name $upstream;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location ~ ^/mtproto/http/(?<sub>pluto|venus|aurora|vesta|flora)(?<media>-1)?/(?<path>apiw1|apiw_test1)$ {
    set $upstream $sub$media.web.telegram.org;

    proxy_pass https://$upstream/$path;
    proxy_http_version 1.1;
    proxy_set_header Host $upstream;
    proxy_set_header Connection "";
    proxy_set_header Origin https://web.telegram.org;

    proxy_ssl_server_name on;
    proxy_ssl_name $upstream;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # MTProto over HTTP long-polls; the body is binary and must not be reframed.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 8m;
  }

  location / {
    return 404;
  }
}
