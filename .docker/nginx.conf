server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  # index.html must NEVER be heuristically cached. Without an explicit
  # Cache-Control, browsers cache it for ~10% of its age and keep serving a
  # stale document that references old, content-hashed chunk filenames. After a
  # redeploy those chunks 404, the dynamic import() fails, and the app renders a
  # permanent white page ("white screen after a day"). Force revalidation.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # The service worker registration script must also always be revalidated so a
  # new deploy's SW is picked up promptly.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Content-hashed assets are immutable — their name changes when content
  # changes — so they can be cached aggressively and forever.
  location ~* \.(?:js|css|wasm|woff2?|ttf|json|png|jpe?g|svg|ico|tgs|mp3|webmanifest)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback: unknown routes serve the (always-fresh) index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
