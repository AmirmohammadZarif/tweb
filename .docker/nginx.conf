server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # NOTE: gzip is intentionally OFF here. This container sits behind the
  # single-buffering tweb-auth Python proxy, and gzip makes nginx respond with
  # Transfer-Encoding: chunked (no Content-Length). That proxy can't forward a
  # chunked body cleanly, so NPM fails to re-frame it for HTTP/2
  # (ERR_HTTP2_PROTOCOL_ERROR in the browser). Edge gzip is handled by NPM.

  # index.html must NEVER be heuristically cached. Without an explicit
  # Cache-Control, browsers cache it for ~10% of its age and keep serving a
  # stale document that references old, content-hashed chunk filenames. After a
  # redeploy those chunks 404, the dynamic import() fails, and the app renders a
  # permanent white page ("white screen after a day"). Force revalidation.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # NOTE: there is deliberately no `location = /sw.js`. The service worker is
  # imported as `../../sw?worker&url` (apiManagerProxy.ts), so Vite emits it
  # content-hashed as sw-<hash>.js — nothing is ever served at /sw.js and such a
  # block would be dead config. The hashed name means the immutable rule below
  # is correct for it, and browsers bypass the HTTP cache for the top-level
  # service-worker script on update checks regardless.

  # Source maps are uploaded to GlitchTip at build time and then DELETED from
  # dist/ (sourcemaps.filesToDeleteAfterUpload in vite.config.ts) — they must
  # never be served from here, or anyone can reconstruct the full source. This
  # block is defence in depth for that, and it also fixes a confusing symptom:
  # ".map" is absent from the asset regex below, so without this rule a map
  # request falls through to the SPA fallback and devtools receives index.html
  # with a 200 instead of a clean miss.
  #
  # Must precede the asset rule: nginx takes the FIRST matching regex location,
  # and "foo.js.map" would otherwise be re-examined against a rule that is only
  # meant for real assets.
  location ~* \.map$ {
    return 404;
  }

  # Content-hashed assets are immutable — their name changes when content
  # changes — so they can be cached aggressively and forever.
  location ~* \.(?:js|css|wasm|woff2?|ttf|json|png|jpe?g|svg|ico|tgs|mp3|webmanifest)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Routes owned by the service worker's fetch handler (index.service.ts). When
  # the SW is installed these never reach nginx. When it is NOT controlling the
  # page — first load, or right after a failed registration — they must 404 so
  # the caller fails fast. Letting them fall through to the SPA rule below hands
  # a <video src="/stream/..."> an HTTP 200 with an HTML body, which surfaces as
  # a confusing decode error instead of a clean miss.
  location ~ ^/(?:stream|download|d|share|ping|rtmp|hls|hls_quality_file|hls_stream|backgrounds)/ {
    return 404;
  }

  # SPA fallback: unknown routes serve the (always-fresh) index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
